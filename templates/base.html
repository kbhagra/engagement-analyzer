<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CampaignLens{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/results.css') }}">
</head>

<body>
    <nav class="topbar">
        <a class="brand" href="/">Campaign<span>Lens</span></a>
        <div class="topbar-links">
            <a href="/">New analysis</a>
            <a href="{{ url_for('results.download') }}" class="btn-ghost">Download CSV</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        Data source: YouTube Data API v3 &middot; Metrics reflect publicly visible
        statistics only (views, likes, comments).
    </footer>
</body>

</html>
